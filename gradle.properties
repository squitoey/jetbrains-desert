# Plugin coordinates. `version` names the distribution zip and is written into
# plugin.xml at build time by patchPluginXml.
pluginGroup = com.dallinjones.jetbrains
pluginVersion = 1.1.1

# Oldest IDE the plugin declares support for. 213 = 2021.3; themes rely only on
# platform APIs, so there is no reason to require anything newer.
pluginSinceBuild = 213

# The IDE the plugin is compiled and `runIde`-tested against. Any recent
# version will do - a theme contains no code, so this only affects the sandbox
# IDE that `runIde` launches.
platformType = IC
platformVersion = 2024.3

org.gradle.caching = true
